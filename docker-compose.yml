version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: glitch-redis
    restart: always
    # No external port exposure - only accessible via Docker network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: glitch-postgres
    restart: always
    environment:
      POSTGRES_DB: glitchexecutor
      POSTGRES_USER: ${PG_USER:-glitch}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
    # No external port exposure - only accessible via Docker network
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-glitch} -d glitchexecutor"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ensemble:
    build: ./ensemble
    container_name: glitch-ensemble
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SENTIMENT_LLM_KEY: ${SENTIMENT_LLM_KEY}
      SENTIMENT_LLM_PROVIDER: ${SENTIMENT_LLM_PROVIDER:-anthropic}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      CMC_API_KEY: ${CMC_API_KEY}
      FREECRYPTO_TOKEN: ${FREECRYPTO_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # cTrader Live Account (admin — used as data feed for all symbols)
      CTRADER_CLIENT_ID: ${CTRADER_CLIENT_ID}
      CTRADER_CLIENT_SECRET: ${CTRADER_CLIENT_SECRET}
      CTRADER_ACCESS_TOKEN: ${CTRADER_ACCESS_TOKEN}
      CTRADER_ACCOUNT_ID: ${CTRADER_ACCOUNT_ID}
      CTRADER_LIVE: ${CTRADER_LIVE:-true}
      # Vertex AI (Gemini sentiment)
      GCP_PROJECT: ${GCP_PROJECT:-capable-boulder-487806-j0}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # MT5 Data Service — runs on host via Wine Python (systemd: mt5-data-service)
      MT5_SERVICE_URL: ${MT5_SERVICE_URL:-http://host.docker.internal:7777}
      # IB Pro Gateway — relayed via socat (ib-gateway-bridge.service)
      # socat listens on 0.0.0.0:4003, forwards to 127.0.0.1:4002 (IB Gateway API)
      IB_HOST: ${IB_HOST:-host.docker.internal}
      IB_PORT: ${IB_PORT:-4003}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "metadata.google.internal:169.254.169.254"
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  telegram_bot:
    build: ./telegram_bot
    container_name: glitch-telegram-bot
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${PG_USER:-glitch}:${PG_PASSWORD:-changeme}@postgres:5432/glitchexecutor
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ORCHESTRATOR_LLM_KEY: ${ORCHESTRATOR_LLM_KEY}
      ORCHESTRATOR_LLM_PROVIDER: ${ORCHESTRATOR_LLM_PROVIDER:-anthropic}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID}
      PAYMENT_SERVICE_URL: http://payment:5002
      # On-demand ensemble API (internal Docker network)
      ENSEMBLE_API_URL: http://ensemble:8100
      # Vertex AI (Gemini RAG assistant)
      GCP_PROJECT: ${GCP_PROJECT:-capable-boulder-487806-j0}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  executor:
    build: ./executor
    container_name: glitch-executor
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://${PG_USER:-glitch}:${PG_PASSWORD:-changeme}@postgres:5432/glitchexecutor
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY}
      BINANCE_TESTNET_SECRET: ${BINANCE_TESTNET_SECRET}
      MT5_BRIDGE_URL: ${MT5_BRIDGE_URL}
      MT5_BRIDGE_KEY: ${MT5_BRIDGE_KEY}
      # cTrader fallback credentials (used when customer has no personal account linked)
      CTRADER_CLIENT_ID: ${CTRADER_CLIENT_ID}
      CTRADER_CLIENT_SECRET: ${CTRADER_CLIENT_SECRET}
      EXECUTOR_MOCK_MODE: ${EXECUTOR_MOCK_MODE:-true}
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  payment:
    build: ./payment
    container_name: glitch-payment
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PG_USER:-glitch}:${PG_PASSWORD:-changeme}@postgres:5432/glitchexecutor
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Resend — transactional email (replaces AWS SES)
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-support@glitchexecutor.com}
      SITE_URL: ${SITE_URL:-https://glitchexecutor.com}
      # Tracking pixels & CAPI (server-side conversion events)
      META_PIXEL_ID: ${META_PIXEL_ID:-1238175855166679}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN}
      TIKTOK_PIXEL_ID: ${TIKTOK_PIXEL_ID:-D6BP003C77U1CE9DD290}
      TIKTOK_CAPI_TOKEN: ${TIKTOK_CAPI_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin_api:
    build: ./admin_api
    container_name: glitch-admin-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PG_USER:-glitch}:${PG_PASSWORD:-changeme}@postgres:5432/glitchexecutor
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DASHBOARD_URL: http://172.17.0.1:5000
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@glitchexecutor.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DOCKER_HOST: tcp://docker-proxy:2375
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TRADE_WEBHOOK_SECRET: ${TRADE_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:5004:5003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Docker Socket Proxy — restricts Docker API access for admin_api ──
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: glitch-docker-proxy
    restart: always
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_RESTARTS: 1
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      EXEC: 0
      BUILD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  redis_data:
  pg_data:
