version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: glitch-redis
    restart: always
    # No external port exposure - only accessible via Docker network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: glitch-postgres
    restart: always
    environment:
      POSTGRES_DB: glitchexecutor
      POSTGRES_USER: ${PG_USER:-glitch}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
    # No external port exposure - only accessible via Docker network
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-glitch} -d glitchexecutor"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  payment:
    build: ./payment
    container_name: glitch-payment
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PG_USER:-glitch}:${PG_PASSWORD:-changeme}@postgres:5432/glitchexecutor
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Resend — transactional email (replaces AWS SES)
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-support@glitchexecutor.com}
      SITE_URL: ${SITE_URL:-https://glitchexecutor.com}
      # Tracking pixels & CAPI (server-side conversion events)
      META_PIXEL_ID: ${META_PIXEL_ID:-1238175855166679}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN}
      TIKTOK_PIXEL_ID: ${TIKTOK_PIXEL_ID:-D6BP003C77U1CE9DD290}
      TIKTOK_CAPI_TOKEN: ${TIKTOK_CAPI_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
    ports:
      - "127.0.0.1:5002:5002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin_api:
    build: ./admin_api
    container_name: glitch-admin-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${PG_USER:-glitch}:${PG_PASSWORD:-changeme}@postgres:5432/glitchexecutor
      # Read-only access to host postgres glitch_ml DB (Ouroboros trading data) via mounted unix socket
      ML_DATABASE_URL: postgresql://glitchml_ro:${ML_RO_PASSWORD}@/glitch_ml?host=/var/run/postgresql
      # Read-only access to host postgres glitch_sales_agent (Glitch Budz)
      SA_DATABASE_URL: postgresql://glitch_sa_ro:${SA_RO_PASSWORD}@/glitch_sales_agent?host=/var/run/postgresql&options=-c%20search_path%3Dsales_agent%2Cpublic
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SSO_VALIDATE_URL: ${SSO_VALIDATE_URL:-https://sso.glitchexecutor.com/auth/validate}
      DASHBOARD_URL: http://172.17.0.1:5000
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@glitchexecutor.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DOCKER_HOST: tcp://docker-proxy:2375
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TRADE_WEBHOOK_SECRET: ${TRADE_WEBHOOK_SECRET}
    volumes:
      - /var/run/postgresql:/var/run/postgresql:ro
    ports:
      - "127.0.0.1:5004:5003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Docker Socket Proxy — restricts Docker API access for admin_api ──
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: glitch-docker-proxy
    restart: always
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_RESTARTS: 1
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      EXEC: 0
      BUILD: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  redis_data:
  pg_data:
